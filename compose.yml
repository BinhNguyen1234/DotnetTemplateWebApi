services:
  web-controller-api:
    image: "web-controller-api-v1"
    build:
      context: .
      dockerfile: WebControllerApi/Dockerfile
    container_name: my-api-controller-container
    networks:
      - my-network-1
    depends_on:
      - pg-sql-binh
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Database1=Host=pg-sql-binh;Port=5432;Database=test_db;Username=postgres;Password=170116Abc
  rate-limiter-api:
    image: "rate-limiter-api-v1"
    build:
      context: .
      dockerfile: RateLimiterService/Dockerfile
    container_name : rate-limiter-api-container
    networks:
      - my-network-1
    depends_on:
      redis-binh:
        condition: service_healthy
    ports:
      - "5003:8080"
  web-minimal-api:
    image: "web-minimal-api-v1"
    container_name: web-minimal-api-container
    build:
      context: .
      dockerfile: WebMinimalApiAOT/Dockerfile
    networks:
      - my-network-1
    depends_on:
      pg-sql-binh:
        condition: service_healthy
    ports:
      - "5002:8080"
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - my-network-1
  pg-sql-binh:
    image: postgres:16
    container_name: binh-dev-pgsql
    restart: always
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 170116Abc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - my-network-1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis-binh:
    image: redis:latest
    container_name: binh-dev-redis
    restart: always
    ports:
      - "6389:6379"
    networks:
      - my-network-1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - my-network-1
networks:
  my-network-1:
    driver: bridge
volumes:
  postgres_data_dev:
