global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "web-controller-api"
    static_configs:
      - targets: ["web-controller-api:8080"]
  - job_name: "rate-limiter-api"
    static_configs:
      - targets: ["rate-limiter-api:8080"]