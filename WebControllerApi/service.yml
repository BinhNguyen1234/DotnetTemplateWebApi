apiVersion: v1
kind: Service
metadata:
  name: myapp-service
spec:
  selector:
    app: api-controller-service # matching với những pod nào có app = ...
  ports:
  - name: http
    port: 5000
    targetPort: 8080
    nodePort: 30007
  - name: https
    port: 5001
    targetPort: 8081
    nodePort: 30008
  type: NodePort